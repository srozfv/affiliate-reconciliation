name: Verify calculations and reproducibility
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run generate
      - run: npm run report
      - run: git diff --exit-code -- data dist/demo.js results
